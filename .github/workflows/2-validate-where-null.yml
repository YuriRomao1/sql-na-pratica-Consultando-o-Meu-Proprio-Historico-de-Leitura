name: Validate Step 2 - WHERE and NULL

on:
  push:
    branches:
      - main
    paths:
      - "exercises/02-where-null.sql"

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find active Step 2 issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUMBER=$(gh issue list \
            --state open \
            --search '"SQL Hands-on — Etapa 2" in:title' \
            --json number \
            --jq '.[0].number // empty')

          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

          if [ -z "$NUMBER" ]; then
            echo "Etapa 2 ainda não está ativa. Validação ignorada."
          else
            echo "Issue ativa encontrada: #$NUMBER"
          fi

      - name: Install SQLite
        if: steps.issue.outputs.number != ''
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Validate exercise
        if: steps.issue.outputs.number != ''
        run: bash tests/test-02.sh

      - name: Publish failure feedback
        if: failure() && steps.issue.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body $'❌ **Sua consulta ainda não passou na validação.**\n\nRode `make test-02` no Codespace para ver o resultado.\n\nRevise o filtro e lembre-se: valores `NULL` são tratados com `IS NULL`, não com `= NULL`.'

      - name: Publish success feedback
        if: success() && steps.issue.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body $'✅ **Etapa 2 concluída!**\n\nVocê conseguiu filtrar registros usando `WHERE` e tratar valores ausentes com `IS NULL`.\n\nA infraestrutura v1.0 termina aqui. A próxima etapa de conteúdo será `LIKE`.'
          gh issue close "$ISSUE_NUMBER" --reason completed

name: Validate Step 1 - SELECT

on:
  push:
    branches:
      - main
    paths:
      - "exercises/01-select.sql"

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find active Step 1 issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUMBER=$(gh issue list \
            --state open \
            --search '"SQL Hands-on — Etapa 1" in:title' \
            --json number \
            --jq '.[0].number // empty')

          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

          if [ -z "$NUMBER" ]; then
            echo "Hands-on ainda não foi iniciado. Validação ignorada."
          else
            echo "Issue ativa encontrada: #$NUMBER"
          fi

      - name: Install SQLite
        if: steps.issue.outputs.number != ''
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Validate exercise
        if: steps.issue.outputs.number != ''
        run: bash tests/test-01.sh

      - name: Publish failure feedback
        if: failure() && steps.issue.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body $'❌ **Sua consulta ainda não passou na validação.**\n\nAbra a execução do GitHub Actions ou rode `make test-01` no Codespace para ver o resultado obtido.\n\nRevise quais colunas devem ser retornadas e a quantidade de linhas solicitada. Depois faça um novo commit e push.'

      - name: Publish success feedback
        if: success() && steps.issue.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body $'✅ **Etapa 1 concluída!**\n\nVocê conseguiu consultar colunas específicas e limitar o resultado.\n\nConceitos praticados: `SELECT`, `FROM` e `LIMIT`.\n\nO próximo incremento do hands-on será `WHERE` e `NULL`.'
          gh issue close "$ISSUE_NUMBER" --reason completed
